[project]
name = "keiba-solo-db"
version = "1.0.0"
description = "Horse racing prediction system with SQLite and Streamlit"
readme = "README.md"
authors = [{ name = "Development Team" }]
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.28.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "plotly>=5.17.0",
    "python-dateutil>=2.8.2",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
]

# 開発用依存（uv の dependency-groups。`uv sync` で本体と一緒にインストールされる）
[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "black>=23.12.0",
    "flake8>=6.1.0",
]

# アプリケーション型プロジェクト: このリポジトリ自体はパッケージとして
# インストールせず、依存解決と実行環境（.venv）の管理だけを uv に任せる。
[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

# 外部ライブラリの型チェックをスキップ
[[tool.mypy.overrides]]
module = [
    "streamlit",
    "plotly",
    "sklearn.*",
    "pandas",
    "numpy",
    "requests",
    "bs4",
]
ignore_missing_imports = true

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.flake8]
max-line-length = 100
extend-ignore = "E203, W503, E501"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    ".eggs"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=app --cov-report=term-missing"
