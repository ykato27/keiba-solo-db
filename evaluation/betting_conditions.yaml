# 買い条件の「事前登録」ファイル
#
# 目的: 検証結果を見てから条件を調整する「多重検定」を防ぐため、
# 買い条件はここに固定し、検証前に決める。
#
# ルール:
# - このファイルの値を変えるときは、git コミットに理由を必ず残すこと。
# - 変更後に過去の検証結果と比較する場合は、封印期間（holdout）で再評価すること。
# - テストデータ上で閾値を探索して「一番儲かる条件」を選ぶことは禁止。

ticket_type: win # 現在は単勝のみ対応
ev_threshold: 1.20 # 予測勝率 × オッズ の下限（これ未満は買わない）
min_win_prob: 0.10 # 予測勝率の下限（低確率帯の割安判定は推定誤差に弱いため）
max_bets_per_race: 2 # 1レースあたりの最大点数
unit_bet: 100 # 1点あたりの金額（円）

# 券種ごとの払戻率の前提（JRA公表値。Phase 2 で事前登録）
# 払戻率が高い券種ほど控除が小さい。現状の評価は単勝のみだが、
# 将来の券種拡張時に「どの券種を軸にするか」の判断前提として固定する。
ticket_payout_rates:
  win: 0.80 # 単勝
  place: 0.80 # 複勝
  quinella: 0.775 # 馬連
  wide: 0.775 # ワイド
  trio: 0.75 # 三連複
  trifecta: 0.725 # 三連単

policy:
  # 大穴回避: 単勝オッズがこの値「以上」の馬は買わない。
  # favorite-longshot bias の強い側に立たないため（JRA実測では
  # 単勝50倍以上の回収率は72.5%まで低下する）。
  max_odds: 50.0
  # Kelly基準は分数Kelly（この割合）でのみ使う。
  kelly_fraction: 0.25
  # Kelly は確率がキャリブレーション済みの場合にのみ有効にする。
  # 未較正の確率で Kelly を回すと賭け金が過大になるため。
  kelly_requires_calibration: true

holdout:
  # この日以降のデータは最終評価専用に封印する。
  # 通常のウォークフォワード検証には含めない（明示フラグが必要）。
  start_date: "2025-09-01"

walk_forward:
  n_splits: 4 # ウォークフォワードの分割数（時系列 expanding window）

bootstrap:
  n_samples: 1000 # 回収率の信頼区間を求めるブートストラップ反復数
  seed: 42
